<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt — Biblioteka</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <h1>Biblioteka</h1>

        <nav>
            <a href="index.html">Strona główna</a>
            <a href="add_book.html">Dodaj książkę</a>
            <a href="contact.html">Kontakt</a>
            <a href="register.html">Rejestracja</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Kontakt</h2>

            <form method="post">

                <div>
                    <label for="name">
                        Imię:
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">
                        E-mail:
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div>
                    <label for="subject">
                        Temat:
                    </label>

                    <input
                        type="text"
                        id="subject"
                        name="subject"
                        required
                    >
                </div>

                <div>
                    <label for="message">
                        Wiadomość:
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="50"
                        required
                    ></textarea>
                </div>

                <div>
                    <button type="submit">
                        Wyślij
                    </button>
                </div>

            </form>
        </section>

    </main>

    <footer>
        <p>
            Projekt ćwiczeniowy — Projektowanie aplikacji webowych
        </p>
    </footer>

</body>
</html>
